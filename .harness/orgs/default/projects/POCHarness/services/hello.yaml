service:
  name: hello
  identifier: hello
  orgIdentifier: default
  projectIdentifier: POCHarness
  serviceDefinition:
    type: Kubernetes
    spec:
      manifests:
        - manifest:
            identifier: manifest
            type: K8sManifest
            spec:
              store:
                type: Github
                spec:
                  connectorRef: github
                  gitFetchType: Branch
                  repoName: hello-world
                  branch: main
                  paths:
                    - k8s/deployment.yaml
                    - k8s/service.yaml
              skipResourceVersioning: false
              enableDeclarativeRollback: false
