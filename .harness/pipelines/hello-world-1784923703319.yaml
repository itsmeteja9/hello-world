pipeline:
  identifier: Build_itsmeteja9_hello_world_1784923708151
  name: Build hello-world
  orgIdentifier: default
  projectIdentifier: POCHarness
  properties:
    ci:
      codebase:
        build: <+input>
        connectorRef: account.Github
        repoName: itsmeteja9/hello-world
  stages:
    - stage:
        identifier: build
        name: build
        spec:
          caching:
            enabled: true
          cloneCodebase: true
          execution:
            steps:
              - step:
                  identifier: installdependencies
                  name: install dependencies
                  spec:
                    command: npm install
                  timeout: ""
                  type: Run
              - step:
                  identifier: dockerbuild
                  name: docker_build
                  spec:
                    caching: true
                    connectorRef: <+input>
                    repo: hello/world
                    tags:
                      - latest
                  timeout: ""
                  type: BuildAndPushDockerRegistry
          platform:
            arch: Amd64
            os: Linux
          runtime:
            spec: {}
            type: Cloud
        type: CI
