name: CI/CD - Test, secure and deploy to Cloud Run

on:
  pull_request:
    branches:
      - main
      - dev-demo
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-run-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'hello-world-images' }}
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'hello-world' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_region: ${{ vars.GCP_REGION || 'us-central1' }}
  TF_VAR_repository_id: ${{ vars.GAR_REPOSITORY || 'hello-world-images' }}
  TF_VAR_service_name: ${{ vars.CLOUD_RUN_SERVICE || 'hello-world' }}
  TF_VAR_environment: ${{ vars.DEPLOY_ENVIRONMENT || 'demo' }}
  TF_VAR_allow_unauthenticated: ${{ vars.ALLOW_UNAUTHENTICATED || 'true' }}

jobs:
  unit_tests:
    name: 1A - Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check server.js
          node --check public/client.js

      - name: Run tests with coverage
        run: npm run test:coverage

  sast:
    name: 1B - Open-source SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-security.txt

      - name: Install Semgrep Community Edition
        run: python -m pip install --disable-pip-version-check -r requirements-security.txt

      - name: Run Semgrep SAST
        run: |
          semgrep scan \
            --config p/javascript \
            --config p/nodejs \
            --error \
            --metrics=off \
            .

  repository_security:
    name: 1C - Dependencies, secrets and IaC
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Scan dependencies and repository secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # The demo intentionally makes Cloud Run public. Keep IaC findings visible
      # without blocking until the team documents or removes that exception.
      - name: Review Terraform and Dockerfile configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table

  terraform_validation:
    name: 1D - Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Initialize Terraform without remote state
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

  provision_registry:
    name: 2 - Provision Artifact Registry
    if: github.event_name != 'pull_request'
    needs:
      - unit_tests
      - sast
      - repository_security
      - terraform_validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check required repository settings
        shell: bash
        run: |
          for name in GCP_PROJECT_ID TF_STATE_BUCKET; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions repository variable: ${name}"
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      - name: Prepare commit-tagged image URI
        shell: bash
        run: |
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${CLOUD_RUN_SERVICE}:${GITHUB_SHA}"
          echo "TF_VAR_image=${IMAGE_URI}" >> "${GITHUB_ENV}"
          echo "Image to create: ${IMAGE_URI}"

      - name: Initialize Terraform
        shell: bash
        run: |
          terraform -chdir=terraform init \
            -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=${GCP_PROJECT_ID}/${CLOUD_RUN_SERVICE}"

      - name: Create Artifact Registry repository
        run: |
          terraform -chdir=terraform apply \
            -input=false \
            -auto-approve \
            -target=google_project_service.required \
            -target=google_artifact_registry_repository.app

  build_scan_publish:
    name: 3 - Build, scan and publish image
    needs: provision_registry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Prepare commit-tagged image URI
        id: image
        shell: bash
        run: |
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${CLOUD_RUN_SERVICE}:${GITHUB_SHA}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"
          echo "uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build container image
        run: docker build --pull --tag "${IMAGE_URI}" .

      - name: Scan container image before push
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.uri }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Push approved container image
        run: docker push "${IMAGE_URI}"

  deploy:
    name: 4 - Deploy to Cloud Run
    needs: build_scan_publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: demo
      url: ${{ steps.service.outputs.url }}
    outputs:
      service_url: ${{ steps.service.outputs.url }}

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      - name: Initialize Terraform
        shell: bash
        run: |
          terraform -chdir=terraform init \
            -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=${GCP_PROJECT_ID}/${CLOUD_RUN_SERVICE}"

      - name: Plan Cloud Run deployment
        run: |
          terraform -chdir=terraform plan \
            -input=false \
            -var="image=${{ needs.build_scan_publish.outputs.image_uri }}" \
            -out=tfplan

      - name: Create or update Cloud Run
        run: terraform -chdir=terraform apply -input=false tfplan

      - name: Read Cloud Run URL
        id: service
        shell: bash
        run: |
          SERVICE_URL="$(terraform -chdir=terraform output -raw cloud_run_url)"
          echo "url=${SERVICE_URL}" >> "${GITHUB_OUTPUT}"

  verify:
    name: 5 - Verify live service
    needs:
      - build_scan_publish
      - deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Test health and application page
        shell: bash
        env:
          SERVICE_URL: ${{ needs.deploy.outputs.service_url }}
        run: |
          curl --fail --silent --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            "${SERVICE_URL}/healthz"
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            "${SERVICE_URL}" | grep -q "CI/CD Pipeline Journey"

      - name: Publish deployment summary
        shell: bash
        env:
          IMAGE_URI: ${{ needs.build_scan_publish.outputs.image_uri }}
          SERVICE_URL: ${{ needs.deploy.outputs.service_url }}
        run: |
          {
            echo "### CI/CD deployment completed"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Unit tests | Passed |"
            echo "| Semgrep SAST | Passed |"
            echo "| Dependency and secret scan | Passed |"
            echo "| Container scan | Passed |"
            echo "| Terraform validation | Passed |"
            echo
            echo "- Service: \`${CLOUD_RUN_SERVICE}\`"
            echo "- Image: \`${IMAGE_URI}\`"
            echo "- URL: ${SERVICE_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"
