name: Provision GAR and deploy Cloud Run

on:
  push:
    branches:
      - main
      - demo
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'hello-world-images' }}
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'hello-world' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_region: ${{ vars.GCP_REGION || 'us-central1' }}
  TF_VAR_repository_id: ${{ vars.GAR_REPOSITORY || 'hello-world-images' }}
  TF_VAR_service_name: ${{ vars.CLOUD_RUN_SERVICE || 'hello-world' }}
  TF_VAR_environment: ${{ vars.DEPLOY_ENVIRONMENT || 'demo' }}
  TF_VAR_allow_unauthenticated: ${{ vars.ALLOW_UNAUTHENTICATED || 'true' }}

jobs:
  deploy:
    name: Build infrastructure and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Check required repository settings
        shell: bash
        run: |
          for name in GCP_PROJECT_ID TF_STATE_BUCKET; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions repository variable: ${name}"
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Prepare image URI
        shell: bash
        run: |
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${CLOUD_RUN_SERVICE}:${GITHUB_SHA}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"
          echo "TF_VAR_image=${IMAGE_URI}" >> "${GITHUB_ENV}"

      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Initialize Terraform
        shell: bash
        run: |
          terraform -chdir=terraform init \
            -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=${GCP_PROJECT_ID}/${CLOUD_RUN_SERVICE}"

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

      # Cloud Run cannot be created until its image exists. This first phase
      # creates the repository that will receive that image.
      - name: Create Artifact Registry repository
        run: |
          terraform -chdir=terraform apply \
            -input=false \
            -auto-approve \
            -target=google_project_service.required \
            -target=google_artifact_registry_repository.app

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build container image
        run: docker build --pull --tag "${IMAGE_URI}" .

      - name: Push container image
        run: docker push "${IMAGE_URI}"

      - name: Plan Cloud Run deployment
        run: terraform -chdir=terraform plan -input=false -out=tfplan

      - name: Create or update Cloud Run
        run: terraform -chdir=terraform apply -input=false tfplan

      - name: Verify deployment
        id: verify
        shell: bash
        run: |
          SERVICE_URL="$(terraform -chdir=terraform output -raw cloud_run_url)"
          curl --fail --silent --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            "${SERVICE_URL}/healthz"
          echo "service_url=${SERVICE_URL}" >> "${GITHUB_OUTPUT}"

      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo "### Cloud Run deployment completed"
            echo
            echo "- Service: \`${CLOUD_RUN_SERVICE}\`"
            echo "- Image: \`${IMAGE_URI}\`"
            echo "- URL: ${{ steps.verify.outputs.service_url }}"
          } >> "${GITHUB_STEP_SUMMARY}"
